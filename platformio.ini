[platformio]
src_dir = .
default_envs = lonelybinary_esp32_gold

; Lonely Binary ESP32 "Gold Edition" (classic ESP32-WROOM-32): dual-core
; Xtensa LX6, 4 MB flash, no PSRAM, onboard USB-UART bridge, and an onboard
; WS2812 RGB LED on GPIO2. Uses the generic esp32dev profile.
[env:lonelybinary_esp32_gold]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    mikalhart/TinyGPSPlus@^1.0.3

build_src_filter = +<main.cpp>

board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; Sniffer companion (RADIO half of the split-brain detector): sniffs Flock WiFi
; and streams detections over a UART to an Arduino GIGA. No GPS/SPIFFS/BLE.
[env:esp32_companion]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<esp32_companion/> -<main.cpp>
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
board_build.partitions = partitions.csv
