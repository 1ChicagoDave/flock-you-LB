[platformio]
src_dir = .
; Default build stays the Gold Edition; build the display board explicitly with
;   pio run -e hosyond_e32r40t
default_envs = lonelybinary_esp32_gold

; Lonely Binary ESP32 "Gold Edition" (classic ESP32-WROOM-32): dual-core
; Xtensa LX6, 4 MB flash, no PSRAM, onboard USB-UART bridge, and an onboard
; WS2812 RGB LED on GPIO2. Uses the generic esp32dev profile.
[env:lonelybinary_esp32_gold]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    mikalhart/TinyGPSPlus@^1.0.3

build_src_filter = +<main.cpp>

board_build.partitions = partitions.csv
board_build.filesystem = spiffs


; LCDWIKI E32R40T — 4.0" ESP32-32E display module (ST7796S 320x480, XPT2046
; resistive touch, microSD, SC8002B speaker amp, RGB LED, Li-battery + TP4054).
; Pin map is from the official spec §4.2 + schematic. Display+touch on HSPI
; (14/13/12); SD on VSPI (18/23/19, CS 5). Sources live in hosyond/.
[env:hosyond_e32r40t]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<hosyond/> -<hosyond/bringup.cpp> -<main.cpp>

board_build.partitions = partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI display + touch config (no User_Setup.h edits needed) ----
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1          ; LCD reset is tied to the ESP32 EN pin (no GPIO)
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    mikalhart/TinyGPSPlus@^1.0.3
