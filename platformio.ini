[platformio]
src_dir = .

; Lonely Binary ESP32-S3 "Gold Edition" (N16R8): ESP32-S3, 16 MB QIO flash,
; 8 MB OPI PSRAM, onboard WS2812 RGB LED (GPIO48), native dual USB-C.
;
; The stock espressif32 6.x platform only ships the base esp32-s3-devkitc-1
; profile (N8, no PSRAM), so we start from it and override flash size + PSRAM:
;   - board_build.arduino.memory_type = qio_opi  -> QIO flash + OPI (octal) PSRAM
;   - board_upload.flash_size / maximum_size     -> full 16 MB chip
[env:lonelybinary_esp32s3_gold]
platform = espressif32@^6.3.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; 16 MB flash overrides (base profile is 8 MB)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
